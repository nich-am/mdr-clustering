name: Streamlit Keepalive

# Visits the Streamlit app on a schedule so it never sits idle long enough
# to trigger Streamlit Community Cloud's inactivity sleep.
# Runs independently — no need for anyone to manually open the app.

on:
  schedule:
    - cron: '0 4 */3 * *'   # 04:00 UTC, every 3rd day (offset 1hr from Supabase ping)
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # >>> REPLACE the URL below with your actual Streamlit app URL <<<
      # e.g. https://your-app-name.streamlit.app
      - name: Visit Streamlit app
        env:
          APP_URL: "https://REPLACE-WITH-YOUR-APP-URL.streamlit.app"
        run: |
          http_code=$(curl -s -o /tmp/response.html -w "%{http_code}" \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 30 \
            -L "$APP_URL")

          echo "HTTP status: $http_code"

          if [ "$http_code" -ge 400 ]; then
            echo "::error::Could not reach Streamlit app, status $http_code"
            exit 1
          fi

          if grep -qi "zzzz\|gone to sleep\|wake.*app" /tmp/response.html; then
            echo "::warning::App appears to still be showing a sleep screen — a plain HTTP visit may not be enough to keep it fully awake. Consider the Playwright-based fallback if this keeps happening."
          else
            echo "App responded normally — keepalive visit succeeded."
          fi
