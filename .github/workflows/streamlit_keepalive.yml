name: Streamlit Keepalive

# Visits the Streamlit app with a real headless browser (not a bare HTTP
# request) so it never sits idle long enough to trigger Streamlit Community
# Cloud's ~12-hour inactivity sleep, and automatically clicks the
# "Yes, get this app back up!" button if it finds the app already asleep.
#
# A plain curl/GET does NOT work here: Streamlit Cloud's wake flow depends
# on cookie-based auth redirects (a bare client loops forever = curl exit
# code 47, "too many redirects"), and even a 200 OK can just be a static
# HTML shell with the actual app never booted. Playwright runs real JS and
# opens the same WebSocket connection a real visitor's browser would.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — safely under the ~12h sleep window
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit app and wake if asleep
        env:
          # >>> REPLACE the URL below with your actual Streamlit app URL <<<
          STREAMLIT_APP_URL: "https://mdr-clustering.streamlit.app/"
        run: python scripts/keepalive_streamlit.py
