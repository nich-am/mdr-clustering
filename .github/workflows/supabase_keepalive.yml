name: Supabase Keepalive

# Pings Supabase DAILY with both a real database WRITE and a READ, so the
# free-tier project never sits idle long enough to trigger the 7-day
# auto-pause. Runs independently of the Streamlit app — no user traffic
# required.
#
# Why daily, not every 3 days:
# Supabase's own docs hedge that a project "may not be paused" even with
# activity if that activity isn't "sufficient" — the exact bar isn't
# fully documented. Daily pings, with a mix of a write AND a read, build
# in much more margin than a single upsert every 3 days.

on:
  schedule:
    - cron: '0 3 * * *'    # 03:00 UTC, every day
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat row
        run: |
          write_code=$(curl -s -o /tmp/write_response.txt -w "%{http_code}" \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 30 \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/app_heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\": 1, \"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")

          echo "Write HTTP status: $write_code"
          cat /tmp/write_response.txt

          if [ "$write_code" -ge 400 ]; then
            echo "::error::Heartbeat WRITE failed with status $write_code after retries"
            exit 1
          fi

      - name: Read heartbeat row back
        run: |
          read_code=$(curl -s -o /tmp/read_response.txt -w "%{http_code}" \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 30 \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/app_heartbeat?id=eq.1&select=pinged_at" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Read HTTP status: $read_code"
          cat /tmp/read_response.txt

          if [ "$read_code" -ge 400 ]; then
            echo "::error::Heartbeat READ failed with status $read_code after retries"
            exit 1
          fi

          echo ""
          echo "Keepalive succeeded — both write and read confirmed."
